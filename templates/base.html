<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KoyCash{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --white: #f5f0e8;
      --yellow: #FFE600;
      --red: #FF2D2D;
      --blue: #0066FF;
      --border: 3px solid var(--black);
      --shadow: 5px 5px 0px var(--black);
      --shadow-sm: 3px 3px 0px var(--black);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--white);
      color: var(--black);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* NAVBAR */
    nav {
      background: var(--yellow);
      border-bottom: var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 26px;
      letter-spacing: -1px;
      text-decoration: none;
      color: var(--black);
      text-transform: uppercase;
    }

    .logo span {
      background: var(--black);
      color: var(--yellow);
      padding: 0 6px;
      margin-left: 2px;
    }

    /* SEARCH BAR */
    .search-form {
      display: flex;
      gap: 0;
    }

    .search-form input {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: var(--border);
      border-right: none;
      padding: 6px 10px;
      background: var(--white);
      width: 160px;
      outline: none;
    }

    .search-form button {
      font-family: 'Archivo Black', sans-serif;
      font-size: 13px;
      border: var(--border);
      background: var(--black);
      color: var(--yellow);
      padding: 6px 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .5px;
      transition: transform .1s;
    }

    .search-form button:active { transform: scale(.96); }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--black);
      border-top: var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 60px;
      z-index: 100;
    }

    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #888;
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 6px 14px;
      transition: color .15s;
    }

    .bottom-nav a svg { width: 22px; height: 22px; }
    .bottom-nav a.active, .bottom-nav a:hover { color: var(--yellow); }

    /* CONTAINER */
    .container { max-width: 800px; margin: 0 auto; padding: 16px; }

    /* SECTION HEADER */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: var(--border);
    }

    .section-header h2 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: -.5px;
    }

    .section-header h2 span {
      background: var(--red);
      color: var(--white);
      padding: 2px 8px;
      font-size: 12px;
      border: 2px solid var(--black);
      margin-left: 8px;
      display: inline-block;
      vertical-align: middle;
    }

    .see-all {
      font-family: 'Archivo Black', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--black);
      border: 2px solid var(--black);
      padding: 4px 10px;
      box-shadow: var(--shadow-sm);
      transition: transform .1s, box-shadow .1s;
    }

    .see-all:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--black);
    }

    /* GAME GRID */
/* CONTAINER UTAMA */
.game-grid {
  display: grid;
  /* Tetap 3 kolom atau sesuaikan kebutuhan */
  grid-template-columns: repeat(3, 1fr); 
  gap: 15px;
  padding: 10px;
}

/* CARD ITEM (Bentuk Vertikal/Portrait) */
.game-card {
  border: var(--border);
  box-shadow: var(--shadow-sm);
  background: var(--white);
  text-decoration: none;
  color: var(--black);
  transition: transform .1s, box-shadow .1s;
  
  display: flex;
  flex-direction: column;
  
  /* KUNCI RASIO: Ini yang membuat bentuknya vertikal sempurna */
  /* Ratio 2/3 artinya Lebar 2 unit, Tinggi 3 unit (seperti kartu) */
  aspect-ratio: 2 / 3; 
  overflow: hidden;
  height: 100%;
}

.game-card:hover {
  transform: translate(-3px, -3px);
  box-shadow: 8px 8px 0 var(--black);
}

/* GAMBAR (Mengisi area atas lebih besar) */
.game-card img {
  width: 100%;
  /* Kita beri 70% dari total tinggi card untuk gambar */
  height: 70%; 
  object-fit: cover;
  object-position: center;
  display: block;
  border-bottom: 2px solid var(--black);
}

/* AREA INFO (Area bawah) */
.game-card-info {
  padding: 8px;
  /* Sisa 30% tinggi card untuk teks & badge */
  flex-grow: 1; 
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--white);
}

.game-card-info p {
  font-size: 10px;
  font-weight: 700;
  line-height: 1.2;
  margin: 0;
  text-align: center;
  text-transform: uppercase;
  
  /* Potong teks jika terlalu panjang agar tidak merusak kotak */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* BADGE (Posisikan di tengah bawah) */
.card-badge {
  display: block;
  text-align: center;
  font-size: 8px;
  background: var(--yellow);
  border: 1.5px solid var(--black);
  padding: 2px 0;
  margin-top: 4px;
}

    /* SKELETON */
    .skeleton {
      background: linear-gradient(90deg, #e0d8cc 25%, #d0c8bc 50%, #e0d8cc 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s infinite;
      border-radius: 2px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card { border: var(--border); box-shadow: var(--shadow-sm); }
    .skeleton-img { width: 100%; height: 160px; }
    .skeleton-text { height: 12px; margin: 8px; }
    .skeleton-text.short { width: 60%; }

    /* TAG PILLS */
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border: 2px solid var(--black);
      margin: 3px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .3px;
      background: var(--white);
      text-decoration: none;
      color: var(--black);
      box-shadow: var(--shadow-sm);
      transition: transform .1s, box-shadow .1s, background .1s;
    }

    .tag:hover, .tag.active {
      background: var(--black);
      color: var(--yellow);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--red);
    }

    /* PAGE TITLE */
    .page-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
      line-height: 1;
      border-bottom: var(--border);
      padding-bottom: 10px;
    }

    .page-title span {
      background: var(--yellow);
      padding: 0 4px;
    }

    /* TOAST */
    #toast {
      display: none;
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--black);
      color: var(--yellow);
      font-weight: 700;
      font-size: 13px;
      padding: 8px 18px;
      border: 2px solid var(--yellow);
      z-index: 9999;
      letter-spacing: .5px;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 40px 20px;
      border: var(--border);
      box-shadow: var(--shadow);
    }

    .empty h3 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 20px;
      text-transform: uppercase;
    }

    .empty p { font-size: 14px; margin-top: 8px; color: #555; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="logo">Koy<span>Cash</span></a>
  <form class="search-form" action="/search" method="get">
    <input type="text" name="q" placeholder="Cari game..." autocomplete="off">
    <button type="submit">Cari</button>
  </form>
</nav>

{% block content %}{% endblock %}

<div id="toast"></div>

<nav class="bottom-nav">
  <a href="/" id="nav-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </a>
  <a href="/search" id="nav-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Cari
  </a>
  <a href="/genre" id="nav-cat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    Genre
  </a>
</nav>

<script>
  // Active nav
  const path = window.location.pathname;
  if (path === '/') document.getElementById('nav-home')?.classList.add('active');
  else if (path.startsWith('/search')) document.getElementById('nav-search')?.classList.add('active');
    // kalau bukan di homepage, biarkan navigasi normal ke /#genre
  }

  function showToast(msg, dur = 2000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', dur);
  }

  // Thumbnail fallback
  function imgFallback(img) {
    img.onerror = null;
    img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="213" viewBox="0 0 120 213"><rect fill="%23e0d8cc" width="120" height="213"/><text fill="%23888" font-size="12" font-family="monospace" x="50%25" y="50%25" text-anchor="middle" dy=".3em">NO IMG</text></svg>';
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
